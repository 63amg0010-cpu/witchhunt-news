name: Vercel Production Deploy

on:
  # ⚠️ 2026-08-17: VERCEL_ORG_ID / VERCEL_PROJECT_ID 값이 현재 프로젝트와 맞지 않아
  #    ("Could not retrieve Project Settings") 매 푸시마다 실패 메일이 쌓이던 상태였다.
  #    자동 실행(push)을 잠시 끄고 수동 실행만 남긴다. 배포는 기존 노트북의 push-feed.mjs가 계속 담당.
  #    → 두 비밀값을 올바른 값으로 고친 뒤 아래 push 블록의 주석을 풀면 자동 배포가 되살아난다.
  # push:
  #   branches:
  #     - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare Vercel project link
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Pull Vercel project settings
        run: npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        run: npx vercel build --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: >
          npx vercel deploy --prebuilt --prod --yes
          --meta githubCommitAuthorName=63amg0010-cpu
          --meta githubCommitAuthorEmail=63amg0010@gmail.com
          --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
